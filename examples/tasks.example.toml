# 种子任务文件示例。
#
# 用法（跳过 8 道问卷，只补选模型）：
#   blindtaste init --tasks examples/tasks.example.toml
#
# 每条任务是一个 [[task]] 块：kind ∈ resume | weekly | ppt | translate | custom，
# prompt 是盲测时原样发给各家模型的任务，内嵌素材让回答可直接对比。

[[task]]
kind = "resume"
prompt = """请把以下三段流水账式工作经历改写成社招简历里的项目描述：每段以动词开头、突出可量化结果、不超过三行，最后单独指出一条你建议补充的量化数据缺口。

经历一：负责公司官网改版，跟设计和外包对接，两个月上线。
经历二：做内部报表工具，把每周手工合并 Excel 的工作自动化了。
经历三：带两个实习生整理用户反馈。"""

[[task]]
kind = "weekly"
prompt = """把以下本周工作流水账整理成发给直属上级的周报：按「进展 / 风险 / 下周计划」三段组织，数据放最前面，全文不超过 200 字。

流水账：周一改了两版 banner；周三上线活动页，UV 1.2 万，比上周多 40%；客服反馈配送问题 17 起，已同步物流；周五复盘会延期。"""

[[task]]
kind = "custom"
prompt = "把下面这段产品介绍改写成小红书文案，保留关键参数，正文不超过 150 字：主打「一键重放重复操作，记录只存本机」。"
