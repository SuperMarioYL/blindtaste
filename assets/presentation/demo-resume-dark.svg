<svg xmlns="http://www.w3.org/2000/svg" width="780" height="180" viewBox="0 0 780 180" data-palette="e1e656-a0e76a-f6ddac-23fdd73d23b1" role="img" aria-labelledby="demo-resume-dark-title demo-resume-dark-desc"><title id="demo-resume-dark-title">BlindTaste 演示步骤 resume（深色）</title><desc id="demo-resume-dark-desc">命令与输出逐字取自 docs/demo-results.json：断点续跑：重跑 run 自动接上（2 对）。</desc><rect width="780" height="180" fill="#0a0c0d"/><rect x='0' y='0' width='780' height='180' rx='12' fill='#131713' stroke='#393c1d' stroke-width='1'/><circle cx='12' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><circle cx='30' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><circle cx='48' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><text x='70' y='24.0' fill='#b1b9a8' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">断点续跑：重跑 run 自动接上（2 对）</text><line x1='0' y1='40' x2='780' y2='40' stroke='#393c1d' stroke-width='1'/><text x='18' y='72' fill='#e1e656' font-size='12.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">$ printf &#x27;b ⏎ a ⏎ &#x27; | blindtaste run --demo --limit 2</text><text x='30' y='96' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">第 1 轮盲测：共 15 对，已完成 3 对，待投 12 对。</text><text x='30' y='116' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">本轮完成：新投 2 对，累计 5/15。</text><text x='30' y='136' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">随时 Ctrl-C 中断，重跑 blindtaste run 会从 5/15 继续。</text></svg>
