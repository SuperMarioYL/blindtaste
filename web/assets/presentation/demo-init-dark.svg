<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" data-palette="e1e656-a0e76a-f6ddac-23fdd73d23b1" role="img" aria-labelledby="demo-init-dark-title demo-init-dark-desc"><title id="demo-init-dark-title">BlindTaste 演示步骤 init（深色）</title><desc id="demo-init-dark-desc">命令与输出逐字取自 docs/demo-results.json：init：8 道选择题生成任务电池。</desc><rect width="780" height="240" fill="#0a0c0d"/><rect x='0' y='0' width='780' height='240' rx='12' fill='#131713' stroke='#393c1d' stroke-width='1'/><circle cx='12' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><circle cx='30' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><circle cx='48' cy='20.0' r='4.5' fill='#b1b9a8' stroke='#131713' stroke-width='0'/><text x='70' y='24.0' fill='#b1b9a8' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">init：8 道选择题生成任务电池</text><line x1='0' y1='40' x2='780' y2='40' stroke='#393c1d' stroke-width='1'/><text x='18' y='72' fill='#e1e656' font-size='12.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">$ printf &#x27;1,2,3,4 ⏎ 1 ⏎ 1 ⏎ 1 ⏎ 1 ⏎ 2 ⏎  ⏎ 1,2,4 ⏎ &#x27; | blindtaste init</text><text x='30' y='96' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">  1. 智谱 GLM-4-Flash（glm-4-flash-250414） · 有免费档</text><text x='30' y='116' fill='#a0e76a' font-size='12' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">✓ 电池已生成：8 条任务（resume × 2、weekly × 2、ppt × 2、translate × </text><text x='30' y='136' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">首轮盲测约 15 对。</text><text x='30' y='156' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">下一步：把 1-2 个 API key 粘贴到 /tmp/bt-demo-final/keys.env，例如</text><text x='30' y='176' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">  ZHIPU_API_KEY=sk-xxx</text><text x='30' y='196' fill='#fdf8ee' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">智谱 glm-4-flash-250414 有免费档；然后运行 blindtaste run。不配 key 也可以先 </text></svg>
