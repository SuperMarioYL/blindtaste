<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" data-palette="e1e656-a0e76a-f6ddac-23fdd73d23b1" role="img" aria-labelledby="demo-run-light-title demo-run-light-desc"><title id="demo-run-light-title">BlindTaste 演示步骤 run（浅色）</title><desc id="demo-run-light-desc">命令与输出逐字取自 docs/demo-results.json：run --demo：匿名 A/B 盲选（3 对）。</desc><rect width="780" height="400" fill="#fefef9"/><rect x='0' y='0' width='780' height='400' rx='12' fill='#fdfdf3' stroke='#f6f7cb' stroke-width='1'/><circle cx='12' cy='20.0' r='4.5' fill='#6e7869' stroke='#fdfdf3' stroke-width='0'/><circle cx='30' cy='20.0' r='4.5' fill='#6e7869' stroke='#fdfdf3' stroke-width='0'/><circle cx='48' cy='20.0' r='4.5' fill='#6e7869' stroke='#fdfdf3' stroke-width='0'/><text x='70' y='24.0' fill='#6e7869' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">run --demo：匿名 A/B 盲选（3 对）</text><line x1='0' y1='40' x2='780' y2='40' stroke='#f6f7cb' stroke-width='1'/><text x='18' y='72' fill='#77792d' font-size='12.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">$ printf &#x27;a ⏎ b ⏎ tie ⏎ &#x27; | blindtaste run --demo --limit 3</text><text x='30' y='96' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">── 对 1/3 · 任务 translate-general</text><text x='30' y='116' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">╭───────────────────────────── 任务（translate） ──────────────────────────────╮</text><text x='30' y='136' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 把下面这段产品说明翻译成英文，面向海外用户，语气自然、不逐字直译：           │</text><text x='30' y='156' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│                                                                              │</text><text x='30' y='176' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 这个功能会把你的重复操作记下来，下次一键重放。你可以随时删除记录，记录只保存 │</text><text x='30' y='196' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 在本机。                                                                     │</text><text x='30' y='216' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x='30' y='236' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">╭─────────────────────────────────── 回答 A ───────────────────────────────────╮</text><text x='30' y='256' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 〔结构式 ·                                                                   │</text><text x='30' y='276' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 演示回答〕围绕「把下面这段产品说明翻译成英文，面向海外用户，语气」，我的处理 │</text><text x='30' y='296' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 思路是：                                                                     │</text><text x='30' y='316' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 一、对照原始素材逐条核对，避免漏项                                           │</text><text x='30' y='336' fill='#262a1c' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">│ 二、补一条缺失的量化口径建议                                                 │</text><text x='30' y='356' fill='#6e7869' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">……（其余 18 行见 docs/demo-results.json）</text></svg>
