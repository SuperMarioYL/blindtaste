name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint (syntax and import check)
        run: |
          python -m compileall -q src tests
          python -c "import blindtaste; print(blindtaste.__version__)"
      - name: Tests
        run: pytest -q
